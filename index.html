function renderChores(){let box=$('#otherPage');let sorted=[...chores].sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date)||a.title.localeCompare(b.title));box.innerHTML=`<div class=chores><div class=choretop><div><h2>Chores</h2><div style="color:#777">Shared through the Perez Family Google Calendar</div></div><button class="btn primary" id="addChore" ${accessToken?'':'disabled'}>＋ Add Chore</button></div><div class=chorefilters><span class="pill">${sorted.filter(x=>!x.done).length} open</span><span class="pill">${sorted.filter(x=>x.done).length} done</span></div><div class=choregrid>${sorted.length?sorted.map(c=>`<div class="chore ${c.done?'done':''}" style="--c:${people[c.person]||people.FAMILY}"><button class=check data-check="${c.id}" title="Mark ${c.done?'open':'done'}">${c.done?'✓':''}</button><div class=cbody><div class=ctitle>${esc(c.title)}</div><div class=cmeta>${c.person} · ${nice(c.date)}${c.repeat!=='none'?' · '+c.repeat:''}</div></div><button class=cedit data-cedit="${c.id}">Edit</button></div>`).join(''):'<div class=empty>No chores yet. Add the first shared family chore.</div>'}</div></div>`;$('#addChore').onclick=openNewChore;$$('[data-check]').forEach(b=>b.onclick=()=>toggleChore(b.dataset.check));$$('[data-cedit]').forEach(b=>b.onclick=()=>editChore(b.dataset.cedit))}
function esc(x){return String(x||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function openNewChore(){$('#cid').value='';$('#ctitleInput').value='';$('#cperson').value='FAMILY';$('#cdate').value=ymd(new Date());$('#crepeat').value='none';$('#cnotes').value='';$('#cdel').hidden=true;$('#choreModalTitle').textContent='Add Chore';$('#choreDlg').showModal()}
function editChore(id){let c=chores.find(x=>String(x.id)===String(id));if(!c)return;$('#cid').value=c.id;$('#ctitleInput').value=c.title;$('#cperson').value=c.person;$('#cdate').value=c.date;$('#crepeat').value=c.repeat||'none';$('#cnotes').value=c.notes||'';$('#cdel').hidden=false;$('#choreModalTitle').textContent='Edit Chore';$('#choreDlg').showModal()}
async function toggleChore(id){let c=chores.find(x=>String(x.id)===String(id));if(!c)return;try{await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({extendedProperties:{shared:{pfhType:'chore',pfhPerson:c.person,pfhDone:String(!c.done),pfhRepeat:c.repeat||'none'}}})});await syncGoogle()}catch(x){alert(x.message)}}
function body(){let d=$('#date').value,t=$('#time').value,en=$('#end').value,o={summary:$('#title').value.trim(),description:$('#notes').value,extendedProperties:{shared:{pfhPerson:$('#person').value}}};if(!t){o.start={date:d};let z=parse(d);z.setDate(z.getDate()+1);o.end={date:ymd(z)}}else{let tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Los_Angeles';o.start={dateTime:d+'T'+t+':00',timeZone:tz};if(!en){let z=new Date(d+'T'+t+':00');z.setHours(z.getHours()+1);en=pad(z.getHours())+':'+pad(z.getMinutes())}o.end={dateTime:d+'T'+en+':00',timeZone:tz}}return o}
function initGoogle(){if(!window.google?.accounts?.oauth2)return setTimeout(initGoogle,300);tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error)return status('Google sign-in failed',true);saveToken(r);connectedUI();syncGoogle()}});if(restoreToken()){connectedUI();status('Restoring Google Calendar…');syncGoogle()}}
$('#googleSignIn').onclick=()=>{if(accessToken)syncGoogle();else tokenClient?.requestAccessToken({prompt:'consent'})};
$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#eid').value;try{await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify(body())});$('#dlg').close();await syncGoogle()}catch(x){alert(x.message)}};
$('#del').onclick=async()=>{let id=$('#eid').value;if(confirm('Delete this event from Perez Family Google Calendar?'))try{await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events/'+encodeURIComponent(id),{method:'DELETE'});$('#dlg').close();await syncGoogle()}catch(x){alert(x.message)}};$('#choreForm').onsubmit=async e=>{e.preventDefault();let id=$('#cid').value;try{let b=choreBody();if(id){let old=chores.find(x=>String(x.id)===String(id));b.extendedProperties.shared.pfhDone=String(old?.done||false)}await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify(b)});$('#choreDlg').close();await syncGoogle();renderChores()}catch(x){alert(x.message)}};$('#cdel').onclick=async()=>{let id=$('#cid').value;if(confirm('Delete this chore?'))try{await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events/'+encodeURIComponent(id),{method:'DELETE'});$('#choreDlg').close();await syncGoogle();renderChores()}catch(x){alert(x.message)}};$('#ccancel').onclick=()=>$('#choreDlg').close();initGoogle();$('#cancel').onclick=()=>$('#dlg').close();$('#add').onclick=openNew;$('#prev').onclick=()=>{view==='month'?anchor.setMonth(anchor.getMonth()-1):anchor.setDate(anchor.getDate()-7);render()};$('#next').onclick=()=>{view==='month'?anchor.setMonth(anchor.getMonth()+1):anchor.setDate(anchor.getDate()+7);render()};$('#today').onclick=()=>{anchor=new Date();render()};$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$$('.nav').forEach(b=>b.onclick=()=>{$$('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');let c=b.dataset.page==='Calendar';$('#calendarPage').hidden=!c;$('#otherPage').hidden=c;if(!c){if(b.dataset.page==='Chores')renderChores();else $('#otherPage').innerHTML=`<div class=placeholder><h2>${b.dataset.page}</h2><p>This section is staged for a future Family Hub feature build.</p></div>`}});function tick(){let d=new Date();$('#clock').innerHTML=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+'<b>'+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</b>'}tick();setInterval(tick,30000);render();
</script>
<script id="v05-enhancements">
(function(){
  function plusOneHour(v){
    if(!v || !/^\d{2}:\d{2}$/.test(v)) return "";
    const [h,m]=v.split(":").map(Number);
    const mins=(h*60+m+60)%(24*60);
    return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
  }
  function wireTimeDefaults(root=document){
    const starts=[...root.querySelectorAll('input[type="time"]')];
    starts.forEach((el,i)=>{
      const label=(el.closest("label")?.textContent||el.parentElement?.textContent||"").toLowerCase();
      if(!label.includes("start")) return;
      if(el.dataset.pfhWired) return;
      el.dataset.pfhWired="1";
      el.addEventListener("change",()=>{
        const times=[...document.querySelectorAll('input[type="time"]')];
        const idx=times.indexOf(el);
        let end=times.slice(idx+1).find(x=>{
          const t=(x.closest("label")?.textContent||x.parentElement?.textContent||"").toLowerCase();
          return t.includes("end");
        }) || times[idx+1];
        if(end && (!end.value || end.dataset.autoEnd==="1")){
          end.value=plusOneHour(el.value);
          end.dataset.autoEnd="1";
          end.dispatchEvent(new Event("input",{bubbles:true}));
          end.dispatchEvent(new Event("change",{bubbles:true}));
        }
      });
    });
  }
  const initials={MOM:"M",DAD:"D",MIGUEL:"M",FONSI:"F",PRINCESS:"P",FAMILY:"👨‍👩‍👧"};
  function decorate(){
    document.querySelectorAll('.event-card,.event,.calendar-event').forEach(card=>{
      if(card.querySelector(".pfh-avatar")) return;
      const txt=(card.textContent||"").toUpperCase();
      const person=Object.keys(initials).find(p=>txt.includes(p));
      if(!person) return;
      card.dataset.person=person;
      const a=document.createElement("span");
      a.className="pfh-avatar "+person;
      a.textContent=initials[person];
      const target=card.querySelector("strong,.event-title,.title")||card.firstElementChild||card;
      if(target===card) card.prepend(a); else target.prepend(a);
    });
    wireTimeDefaults();
  }
  new MutationObserver(decorate).observe(document.documentElement,{subtree:true,childList:true});
  document.addEventListener("DOMContentLoaded",decorate);
})();
</script>


<script id="v06-chore-engine">
(function(){
  const HISTORY_KEY="pfh-chore-history-v06";
  function history(){
    try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}catch(e){return[]}
  }
  function saveHistory(h){
    localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(-300)));
  }
  function isoDate(d){
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function addRepeat(dateStr,repeat){
    const d=new Date(dateStr+"T12:00:00");
    const r=(repeat||"").toLowerCase();
    if(r==="daily") d.setDate(d.getDate()+1);
    else if(r==="weekly") d.setDate(d.getDate()+7);
    else if(r==="monthly") d.setMonth(d.getMonth()+1);
    else return null;
    return isoDate(d);
  }
  window.pfhV06RecordCompletion=function(chore){
    const h=history();
    h.push({
      id:chore.id||"",
      title:chore.title||chore.summary||"Chore",
      person:chore.person||"FAMILY",
      due:chore.date||chore.due||"",
      completedAt:new Date().toISOString()
    });
    saveHistory(h);
  };
  window.pfhV06NextDate=function(dateStr,repeat){return addRepeat(dateStr,repeat)};
  window.pfhV06History=history;

  // Upgrade existing chore cards after every render without replacing the existing Google sync engine.
  function enhanceCards(){
    document.querySelectorAll('[data-chore-id],.chore-card,.chore').forEach(card=>{
      if(card.dataset.v06Enhanced) return;
      card.dataset.v06Enhanced="1";
      card.classList.add("chore-v06-card");
    });
  }
  new MutationObserver(enhanceCards).observe(document.documentElement,{subtree:true,childList:true});
  document.addEventListener("DOMContentLoaded",enhanceCards);
})();
</script>


<script id="v06-chore-recurrence-wrapper">
(function(){
  function install(){
    if(typeof window.toggleChore!=="function" || window.toggleChore.__v06) return;
    const original=window.toggleChore;
    const wrapped=async function(id){
      let c=null;
      try{
        if(Array.isArray(window.chores)) c=window.chores.find(x=>String(x.id)===String(id));
      }catch(e){}
      const wasDone=!!(c&&c.done);
      const result=await original.apply(this,arguments);
      if(c && !wasDone){
        try{ window.pfhV06RecordCompletion(c); }catch(e){}
        const next=window.pfhV06NextDate(c.date||c.due,c.repeat);
        if(next){
          // Advance the same recurring chore to its next occurrence after completion.
          // Existing Google update logic remains source of truth when available.
          c.date=next;c.due=next;c.done=false;
          try{
            if(typeof window.saveChore==="function") await window.saveChore(c,true);
            else if(typeof window.updateChore==="function") await window.updateChore(c,true);
          }catch(e){ console.warn("v0.6 recurrence advance deferred to next sync",e); }
          try{ if(typeof window.renderChores==="function") window.renderChores(); }catch(e){}
        }
      }
      return result;
    };
    wrapped.__v06=true;
    window.toggleChore=wrapped;
  }
  document.addEventListener("DOMContentLoaded",()=>setTimeout(install,0));
  setTimeout(install,500);
})();
</script>
