<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>Perez Family Hub</title><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f4f2ee;--ink:#222;--muted:#777;--mom:#8b5cf6;--dad:#8b929a;--miguel:#f4bd32;--fonsi:#3187cf;--princess:#eb64a4;--family:#48a86d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{padding:24px 28px 90px;min-height:100vh}header,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:30px}.brand p{margin:2px 0;color:var(--muted)}.clock{text-align:right;color:var(--muted);font-size:18px}.clock b{display:block;color:#555;font-size:20px}.people,.left,.views{display:flex;gap:8px;flex-wrap:wrap}.people{margin:16px 0}.pill,.btn{border:0;background:#fff;padding:10px 14px;border-radius:14px;font-weight:750;box-shadow:0 2px 6px #0001}.pill{border-radius:24px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}.pill.off{opacity:.3}.btn.primary,.btn.active{background:#202020;color:#fff}.weektitle{color:#666;font-weight:700;margin:10px 0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border-radius:17px;min-height:355px;padding:10px;box-shadow:0 2px 7px #0000000b}.dayhead{text-align:center;border-bottom:1px solid #eee;padding-bottom:9px;margin-bottom:9px}.dow{font-size:12px;font-weight:800;color:#777}.num{font-size:23px;font-weight:800}.todaynum{background:#222;color:white;border-radius:50%;width:37px;height:37px;line-height:37px;margin:auto}.event,.listrow{border-left:6px solid var(--c);background:#f7f7f7;border-radius:10px;padding:8px;margin:6px 0;font-size:13px;cursor:pointer}.event b,.listrow b{display:block;font-size:14px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.panel,.placeholder,.schedule{background:#fff;border-radius:17px;padding:16px}.panel{min-height:120px}.panel h2{margin:0 0 8px}.empty{color:#999}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.mday{background:#fff;border-radius:14px;min-height:115px;padding:8px}.mday.muted{opacity:.38}.mnum,.sched-date{font-weight:800}.sched-date{font-size:18px;margin:15px 0 6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding:9px;z-index:5}.nav{border:0;background:transparent;border-radius:12px;padding:9px 22px;font-weight:750;color:#777}.nav.active{background:#eee;color:#222}.placeholder{min-height:500px;padding:28px}.placeholder h2{font-size:28px}.placeholder p{color:#777}dialog{border:0;border-radius:20px;padding:0;box-shadow:0 20px 70px #0005;width:min(520px,92vw)}dialog::backdrop{background:#0007}.modal{padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.actions{display:flex;justify-content:space-between;margin-top:18px}.danger{background:#b42318;color:#fff}@media(max-width:900px){.app{padding:16px 12px 88px}.week{overflow-x:auto;grid-template-columns:repeat(7,150px)}.panels{grid-template-columns:1fr}.views{display:none}.nav{padding:9px 12px}}
</style></head><body><div class="app"><header><div class="brand"><h1>PEREZ FAMILY</h1><p>Family Hub <small>v0.3.1</small></p></div><div class="clock" id="clock"></div></header><div class="people" id="people"></div>
<section id="calendarPage"><div class="toolbar"><div class="left"><button class="btn" id="prev">‹ Previous</button><button class="btn" id="today">Today</button><button class="btn" id="next">Next ›</button></div><div class="views"><button class="btn active" data-view="week">Week</button><button class="btn" data-view="month">Month</button><button class="btn" data-view="schedule">Schedule</button></div><div class="left"><span id="syncStatus" style="color:#777;font-weight:700">Google Calendar not connected</span><button class="btn" id="googleSignIn">Connect Google</button><button class="btn" id="sync" hidden>↻ Sync</button><button class="btn primary" id="add" disabled>＋ Add Event</button></div></div><div class="weektitle" id="range"></div><main id="content"></main><div class="panels"><div class="panel"><h2>Today</h2><div id="todayList"></div></div><div class="panel"><h2>Coming Next</h2><div id="nextList"></div></div></div></section><section id="otherPage" hidden></section></div>
<nav class="bottom"><button class="nav active" data-page="Calendar">▣ Calendar</button><button class="nav" data-page="Chores">✓ Chores</button><button class="nav" data-page="Meals">⌂ Meals</button><button class="nav" data-page="Lists">☷ Lists</button></nav>
<dialog id="dlg"><form class="modal" id="form"><h2 id="modalTitle">Add Event</h2><input type="hidden" id="eid"><div class="field"><label>Event</label><input id="title" required></div><div class="grid2"><div class="field"><label>Person</label><select id="person"></select></div><div class="field"><label>Date</label><input id="date" type="date" required></div></div><div class="grid2"><div class="field"><label>Start time</label><input id="time" type="time"></div><div class="field"><label>End time</label><input id="end" type="time"></div></div><div class="field"><label>Notes</label><textarea id="notes"></textarea></div><div class="actions"><button type="button" class="btn danger" id="del" hidden>Delete</button><div><button type="button" class="btn" id="cancel">Cancel</button> <button class="btn primary">Save Event</button></div></div></form></dialog>
<script>
const people={MOM:'#8b5cf6',DAD:'#8b929a',MIGUEL:'#f4bd32',FONSI:'#3187cf',PRINCESS:'#eb64a4',FAMILY:'#48a86d'},$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let events=[],active=new Set(Object.keys(people)),anchor=new Date(),view='week';const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>{let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},sw=d=>{let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x},t12=t=>{if(!t)return'All day';let[h,m]=t.split(':').map(Number),a=h>=12?'PM':'AM';return(h%12||12)+':'+pad(m)+' '+a},nice=s=>{let d=parse(s),td=ymd(new Date()),tm=new Date();tm.setDate(tm.getDate()+1);return s===td?'Today':s===ymd(tm)?'Tomorrow':d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})},vis=e=>active.has(e.person);
function ev(e){return `<div class="event" data-id="${e.id}" style="--c:${people[e.person]}"><b>${e.title}</b>${t12(e.time)} · ${e.person}</div>`}function ppl(){peopleEl=$('#people');peopleEl.innerHTML='';Object.entries(people).forEach(([n,c])=>{let b=document.createElement('button');b.className='pill'+(active.has(n)?'':' off');b.innerHTML=`<span class=dot style="background:${c}"></span>${n}`;b.onclick=()=>{active.has(n)?active.delete(n):active.add(n);render()};peopleEl.appendChild(b)})}
function week(){let s=sw(anchor),ds=[];for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);ds.push(d)}$('#range').textContent=ds[0].toLocaleDateString([],{month:'long',day:'numeric'})+' – '+ds[6].toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});$('#content').innerHTML='<div class=week>'+ds.map(d=>{let x=ymd(d),es=events.filter(e=>e.date===x&&vis(e)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class=day><div class=dayhead><div class=dow>${d.toLocaleDateString([],{weekday:'short'}).toUpperCase()}</div><div class="num ${x===ymd(new Date())?'todaynum':''}">${d.getDate()}</div></div>${es.map(ev).join('')}</div>`}).join('')+'</div>'}
function month(){let f=new Date(anchor.getFullYear(),anchor.getMonth(),1),g=new Date(f);g.setDate(1-f.getDay());$('#range').textContent=anchor.toLocaleDateString([],{month:'long',year:'numeric'});let a=[];for(let i=0;i<42;i++){let d=new Date(g);d.setDate(g.getDate()+i);let x=ymd(d),es=events.filter(e=>e.date===x&&vis(e)).slice(0,3);a.push(`<div class="mday ${d.getMonth()!=anchor.getMonth()?'muted':''}"><div class=mnum>${d.getDate()}</div>${es.map(ev).join('')}</div>`)}$('#content').innerHTML='<div class=month>'+a.join('')+'</div>'}
function schedule(){let es=events.filter(e=>vis(e)&&e.date>=ymd(sw(anchor))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,40),last='',h='<div class=schedule>';es.forEach(e=>{if(e.date!==last){h+=`<div class=sched-date>${nice(e.date)}</div>`;last=e.date}h+=ev(e)});$('#range').textContent='Upcoming schedule';$('#content').innerHTML=h+(es.length?'':'<div class=empty>No upcoming events.</div>')+'</div>'}
function panels(){let td=ymd(new Date()),a=events.filter(e=>e.date===td&&vis(e)).sort((x,y)=>(x.time||'').localeCompare(y.time||'')),b=events.filter(e=>e.date>=td&&vis(e)).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).slice(0,5);$('#todayList').innerHTML=a.length?a.map(e=>`<div class=listrow data-id="${e.id}" style="--c:${people[e.person]}"><b>${e.title}</b>${t12(e.time)} · ${e.person}</div>`).join(''):'<div class=empty>Nothing scheduled yet.</div>';$('#nextList').innerHTML=b.length?b.map(e=>`<div class=listrow data-id="${e.id}" style="--c:${people[e.person]}"><b>${e.title}</b>${nice(e.date)} · ${t12(e.time)} · ${e.person}</div>`).join(''):'<div class=empty>No upcoming events.</div>'}
function bind(){$$('[data-id]').forEach(x=>x.onclick=()=>edit(x.dataset.id))}function render(){ppl();view==='week'?week():view==='month'?month():schedule();panels();$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));bind()}
$('#person').innerHTML=Object.keys(people).map(x=>`<option>${x}</option>`).join('');function openNew(){$('#eid').value='';$('#title').value='';$('#date').value=ymd(new Date());$('#time').value='';$('#end').value='';$('#notes').value='';$('#person').value='FAMILY';$('#del').hidden=true;$('#modalTitle').textContent='Add Event';$('#dlg').showModal()}function edit(id){let e=events.find(x=>String(x.id)===String(id));if(!e)return;['title','date','time','end','notes','person'].forEach(k=>$('#'+k).value=e[k]||'');$('#eid').value=e.id;$('#del').hidden=false;$('#modalTitle').textContent='Edit Event';$('#dlg').showModal()}
const CLIENT_ID='625809892764-9urcd7nrlodv7oqlb8vevsl3mt43ip7e.apps.googleusercontent.com',CALENDAR_ID='099a364523e965651bacb6235722c386f215f4d202d53f790e89cdb4ef1ea843@group.calendar.google.com',SCOPE='https://www.googleapis.com/auth/calendar.events',TOKEN_KEY='pfh-google-token-v031';let tokenClient,accessToken;
function saveToken(r){accessToken=r.access_token;let expiresAt=Date.now()+Math.max(0,(Number(r.expires_in)||3600)-60)*1000;localStorage.setItem(TOKEN_KEY,JSON.stringify({accessToken,expiresAt}))}
function clearToken(){accessToken=null;localStorage.removeItem(TOKEN_KEY)}
function restoreToken(){try{let x=JSON.parse(localStorage.getItem(TOKEN_KEY)||'null');if(x?.accessToken&&x?.expiresAt>Date.now()){accessToken=x.accessToken;return true}}catch{}clearToken();return false}
function connectedUI(){\$('#googleSignIn').textContent='Reconnect Google';\$('#sync').hidden=false;\$('#add').disabled=false}
function status(x,b=false){$('#syncStatus').textContent=x;$('#syncStatus').style.color=b?'#b42318':'#777'}
async function api(path,opt={}){let r=await fetch('https://www.googleapis.com/calendar/v3'+path,{...opt,headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}});if(r.status===401){clearToken();$('#add').disabled=true;$('#sync').hidden=true;$('#googleSignIn').textContent='Connect Google';status('Google session expired — reconnect',true);throw Error('Google session expired')}if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.error?.message||'Google Calendar error')}return r.status===204?null:r.json()}
function fromGoogle(g){let ad=!!g.start.date;return{id:g.id,title:g.summary||'(Untitled)',person:g.extendedProperties?.shared?.pfhPerson||'FAMILY',date:ad?g.start.date:g.start.dateTime.slice(0,10),time:ad?'':g.start.dateTime.slice(11,16),end:ad?'':(g.end?.dateTime?.slice(11,16)||''),notes:g.description||''}}
async function syncGoogle(){if(!accessToken)return;status('Syncing…');try{let a=new Date(anchor.getFullYear(),anchor.getMonth()-2,1),b=new Date(anchor.getFullYear(),anchor.getMonth()+14,1),q=new URLSearchParams({timeMin:a.toISOString(),timeMax:b.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'2500'}),j=await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events?'+q);events=(j.items||[]).filter(x=>x.status!=='cancelled').map(fromGoogle);status('Google Calendar connected ✓');render()}catch(e){status(e.message,true)}}
function body(){let d=$('#date').value,t=$('#time').value,en=$('#end').value,o={summary:$('#title').value.trim(),description:$('#notes').value,extendedProperties:{shared:{pfhPerson:$('#person').value}}};if(!t){o.start={date:d};let z=parse(d);z.setDate(z.getDate()+1);o.end={date:ymd(z)}}else{let tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Los_Angeles';o.start={dateTime:d+'T'+t+':00',timeZone:tz};if(!en){let z=new Date(d+'T'+t+':00');z.setHours(z.getHours()+1);en=pad(z.getHours())+':'+pad(z.getMinutes())}o.end={dateTime:d+'T'+en+':00',timeZone:tz}}return o}
function initGoogle(){if(!window.google?.accounts?.oauth2)return setTimeout(initGoogle,300);tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error)return status('Google sign-in failed',true);saveToken(r);connectedUI();syncGoogle()}});if(restoreToken()){connectedUI();status('Restoring Google Calendar…');syncGoogle()}}
$('#googleSignIn').onclick=()=>tokenClient?.requestAccessToken({prompt:accessToken?'':'consent'});$('#sync').onclick=syncGoogle;
$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#eid').value;try{await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify(body())});$('#dlg').close();await syncGoogle()}catch(x){alert(x.message)}};
$('#del').onclick=async()=>{let id=$('#eid').value;if(confirm('Delete this event from Perez Family Google Calendar?'))try{await api('/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events/'+encodeURIComponent(id),{method:'DELETE'});$('#dlg').close();await syncGoogle()}catch(x){alert(x.message)}};initGoogle();$('#cancel').onclick=()=>$('#dlg').close();$('#add').onclick=openNew;$('#prev').onclick=()=>{view==='month'?anchor.setMonth(anchor.getMonth()-1):anchor.setDate(anchor.getDate()-7);render()};$('#next').onclick=()=>{view==='month'?anchor.setMonth(anchor.getMonth()+1):anchor.setDate(anchor.getDate()+7);render()};$('#today').onclick=()=>{anchor=new Date();render()};$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$$('.nav').forEach(b=>b.onclick=()=>{$$('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');let c=b.dataset.page==='Calendar';$('#calendarPage').hidden=!c;$('#otherPage').hidden=c;if(!c)$('#otherPage').innerHTML=`<div class=placeholder><h2>${b.dataset.page}</h2><p>This section is staged for the next Family Hub feature build. The navigation is now part of the permanent dashboard structure.</p><p><b>Coming:</b> touch-friendly shared entries, family assignments, and the same member colors used by the calendar.</p></div>`});function tick(){let d=new Date();$('#clock').innerHTML=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+'<b>'+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</b>'}tick();setInterval(tick,30000);render();
</script></body></html>
