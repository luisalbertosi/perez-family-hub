<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='theme-color' content='#f5f3ef'><link rel='manifest' href='manifest.json'><title>Family Hub</title><style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#242424;--muted:#777;--line:#ddd;--mom:#8b5cf6;--dad:#7b7f86;--miguel:#f4c542;--fonsi:#3182ce;--princess:#ec6aa7;--family:#49a66b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);overflow-x:hidden}button,input,select{font:inherit}.app{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:30px;font-weight:800}.date{font-size:18px;color:var(--muted);text-align:right}.people{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 18px}.person{border:0;border-radius:999px;padding:9px 14px;font-weight:700;background:#fff;box-shadow:0 1px 5px #0001}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.toolbar button,.add{border:0;background:#fff;border-radius:12px;padding:11px 15px;font-weight:700;box-shadow:0 1px 5px #0001}.add{background:#242424!important;color:#fff}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:var(--card);min-height:390px;border-radius:16px;padding:12px;box-shadow:0 1px 6px #0000000c}.dayhead{text-align:center;border-bottom:1px solid #eee;padding-bottom:9px;margin-bottom:10px}.dow{font-size:12px;color:#777;font-weight:800}.num{font-size:23px;font-weight:800}.today .num{background:#222;color:#fff;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center}.event{padding:9px;border-radius:10px;margin:7px 0;font-size:13px;border-left:6px solid;background:#f8f8f8;cursor:pointer}.event b{display:block}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border-radius:16px;padding:16px;min-height:140px}.panel h3{margin:0 0 10px}.empty{color:#999;font-size:14px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:white;border-radius:20px;padding:22px;width:min(520px,100%)}.box h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.save{background:#222;color:#fff}.delete{background:#fee;color:#a22;margin-right:auto}@media(max-width:900px){.app{padding:10px}.week{grid-template-columns:repeat(7,minmax(130px,1fr));overflow-x:auto}.day{min-height:430px}.bottom{grid-template-columns:1fr}.brand{font-size:24px}}
</style></head><body><div class='app'><div class='top'><div><div class='brand'>PEREZ FAMILY</div><div style='color:#777'>Family Hub</div></div><div class='date' id='clock'></div></div><div class='people' id='people'></div><div class='toolbar'><div><button onclick='shift(-7)'>‹ Previous</button> <button onclick='goToday()'>Today</button> <button onclick='shift(7)'>Next ›</button></div><button class='add' onclick='openModal()'>＋ Add Event</button></div><div class='week' id='week'></div><div class='bottom'><div class='panel'><h3>Today</h3><div id='todayList'></div></div><div class='panel'><h3>Coming Next</h3><div id='nextList'></div></div></div></div>
<div class='modal' id='modal'><div class='box'><h2 id='modalTitle'>Add Event</h2><input type='hidden' id='eid'><div class='field'><label>Event</label><input id='title' placeholder='Soccer, Dentist, School...'></div><div class='field'><label>Person</label><select id='person'></select></div><div class='row'><div class='field'><label>Date</label><input id='date' type='date'></div><div class='field'><label>Time</label><input id='time' type='time'></div></div><div class='actions'><button class='delete' id='del' onclick='removeEvent()'>Delete</button><button onclick='closeModal()'>Cancel</button><button class='save' onclick='saveEvent()'>Save</button></div></div></div>
<script>
const PEOPLE={MOM:'#8b5cf6',DAD:'#7b7f86',MIGUEL:'#f4c542',FONSI:'#3182ce',PRINCESS:'#ec6aa7',FAMILY:'#49a66b'};let anchor=new Date(),filter=null;let events=JSON.parse(localStorage.getItem('familyhub-events')||'[]');
function ymd(d){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}function startWeek(d){let x=new Date(d),day=x.getDay();x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function init(){document.getElementById('people').innerHTML=Object.entries(PEOPLE).map(([n,c])=>`<button class='person' onclick="toggleFilter('${n}')"><span class='dot' style='background:${c}'></span>${n}</button>`).join('');document.getElementById('person').innerHTML=Object.keys(PEOPLE).map(n=>`<option>${n}</option>`).join('');render();tick();setInterval(tick,30000)}function tick(){let d=new Date();document.getElementById('clock').innerHTML=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})+'<br><b>'+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</b>'}
function render(){let s=startWeek(anchor),html='';for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);let key=ymd(d),tod=key===ymd(new Date());let es=events.filter(e=>e.date===key&&(!filter||e.person===filter)).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class='day ${tod?'today':''}'><div class='dayhead'><div class='dow'>${d.toLocaleDateString([],{weekday:'short'}).toUpperCase()}</div><div class='num'>${d.getDate()}</div></div>${es.map(e=>card(e)).join('')}</div>`}document.getElementById('week').innerHTML=html;let today=ymd(new Date());let te=events.filter(e=>e.date===today).sort(sortE);document.getElementById('todayList').innerHTML=te.length?te.map(card).join(''):`<div class='empty'>Nothing scheduled yet.</div>`;let ne=events.filter(e=>e.date>=today).sort(sortE).slice(0,5);document.getElementById('nextList').innerHTML=ne.length?ne.map(e=>card(e,true)).join(''):`<div class='empty'>No upcoming events.</div>`}
function sortE(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}function card(e,showDate=false){let c=PEOPLE[e.person]||'#999';return `<div class='event' style='border-left-color:${c}' onclick="editEvent('${e.id}')"><b>${esc(e.title)}</b><span>${showDate?e.date+' · ':''}${e.time?fmt(e.time)+' · ':''}${e.person}</span></div>`}function fmt(t){let [h,m]=t.split(':').map(Number),ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
function shift(n){anchor.setDate(anchor.getDate()+n);render()}function goToday(){anchor=new Date();render()}function toggleFilter(p){filter=filter===p?null:p;render()}function openModal(date){document.getElementById('modalTitle').textContent='Add Event';document.getElementById('eid').value='';document.getElementById('title').value='';document.getElementById('date').value=date||ymd(new Date());document.getElementById('time').value='';document.getElementById('person').value='FAMILY';document.getElementById('del').style.display='none';document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveEvent(){let title=document.getElementById('title').value.trim(),date=document.getElementById('date').value;if(!title||!date)return alert('Please enter an event and date.');let id=document.getElementById('eid').value;let e={id:id||Date.now().toString(),title,date,time:document.getElementById('time').value,person:document.getElementById('person').value};if(id)events=events.map(x=>x.id===id?e:x);else events.push(e);persist();closeModal();render()}function editEvent(id){let e=events.find(x=>x.id===id);if(!e)return;document.getElementById('modalTitle').textContent='Edit Event';['eid','title','date','time','person'].forEach(k=>document.getElementById(k).value=k==='eid'?e.id:e[k]);document.getElementById('del').style.display='block';document.getElementById('modal').classList.add('open')}function removeEvent(){let id=document.getElementById('eid').value;if(id&&confirm('Delete this event?')){events=events.filter(e=>e.id!==id);persist();closeModal();render()}}function persist(){localStorage.setItem('familyhub-events',JSON.stringify(events))}init();
</script></body></html>
