<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perez Family Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>PEREZ FAMILY</h1><span>Family Hub v0.7.1</span></div>
  <div class="clockbox"><div id="dateText"></div><strong id="timeText"></strong><button id="connectionBtn" class="connection">Reconnect Google</button></div>
</header>

<main>
<section id="calendarPage" class="page active">
  <div class="calendarControls">
    <div class="calendarControlRow">
      <div class="segmented viewTabs"><button data-view="week" class="active">Week</button><button data-view="month">Month</button><button data-view="schedule">Schedule</button></div>
      <div class="dateActions">
        <button id="todayBtn" class="ghost">Today</button>
        <button id="prevBtn" class="ghost arrowBtn" aria-label="Previous">‹</button>
        <button id="nextBtn" class="ghost arrowBtn" aria-label="Next">›</button>
        <button id="addEventBtn" class="primary">+ Add Event</button>
      </div>
    </div>
    <div class="familyFilterRow">
      <span class="filterLabel">Show:</span>
      <div class="filters" id="filters"></div>
    </div>
  </div>
  <div id="calendarTitle" class="sectionTitle"></div>
  <div id="calendarGrid"></div>
  <div class="lower">
    <section class="panel"><h2>Today</h2><div id="todayList"></div></section>
    <section class="panel"><h2>Coming Next</h2><div id="comingList"></div></section>
  </div>
</section>

<section id="choresPage" class="page">
  <div class="pageHead"><div><h2>Chores</h2><p>Shared family chores with recurring due dates.</p></div><button id="addChoreBtn" class="primary">+ Add Chore</button></div>
  <div id="choreStats" class="stats"></div><div id="choreList" class="choreGrid"></div>
</section>
<section id="mealsPage" class="page placeholder"><h2>Meals</h2><p>Weekly meal planning is coming next.</p></section>
<section id="listsPage" class="page placeholder"><h2>Lists</h2><p>Shared grocery and family lists are coming next.</p></section>
</main>

<nav class="bottomNav">
<button data-page="calendar" class="active">📅 <span>Calendar</span></button>
<button data-page="chores">✓ <span>Chores</span></button>
<button data-page="meals">🍽 <span>Meals</span></button>
<button data-page="lists">☷ <span>Lists</span></button>
</nav>

<div id="modal" class="modal hidden">
 <div class="modalCard">
  <button id="modalClose" class="x">×</button>
  <h2 id="modalTitle"></h2>
  <form id="editorForm"></form>
 </div>
</div>

<script src="storage.js"></script>
<script src="google-calendar.js"></script>
<script src="calendar.js"></script>
<script src="chores.js"></script>
<script src="app.js"></script>
</body></html>
